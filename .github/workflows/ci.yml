name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.9.0'

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dating_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @dating-app/db db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dating_app_test
      - name: Run migrations
        run: pnpm --filter @dating-app/db db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dating_app_test
      - run: pnpm turbo test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dating_app_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: test-refresh-secret-32-characters-long
          NODE_ENV: test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dating_app_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @dating-app/web exec playwright install --with-deps chromium
      - name: Generate Prisma client + migrate
        run: pnpm --filter @dating-app/db db:generate && pnpm --filter @dating-app/db db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dating_app_e2e
      # `start` serves build output: node dist/main for the API, next start for the web app.
      # NEXT_PUBLIC_* is inlined at build time, so the API URL has to be set here.
      - name: Build apps
        run: pnpm turbo build --filter=@dating-app/api --filter=@dating-app/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

      # Both servers are started and awaited in one step: a process backgrounded in its own
      # step does not outlive that step, so waiting from a later step always timed out.
      - name: Start servers
        run: |
          NODE_ENV=test PORT=4000 pnpm --filter @dating-app/api start > /tmp/api.log 2>&1 &
          PORT=3000 pnpm --filter @dating-app/web start > /tmp/web.log 2>&1 &
          npx wait-on http://localhost:4000/api/health http://localhost:3000 --timeout 120000
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dating_app_e2e
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: e2e-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: e2e-refresh-secret-32-characters-long
          WEB_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

      - name: Server logs
        if: failure()
        run: tail -n 60 /tmp/api.log /tmp/web.log || true
      - name: Run E2E tests
        run: pnpm --filter @dating-app/web test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @dating-app/db db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
      - run: pnpm turbo build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_MAPBOX_TOKEN: placeholder
