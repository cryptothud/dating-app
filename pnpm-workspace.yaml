packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: set this to true or false

# Transitive pins. These arrive through bcrypt, the Nest CLI and glob, so they cannot be
# raised from any direct dependency.
overrides:
  tar: '>=7.5.19'
  brace-expansion: '>=2.1.2'
  lodash: '>=4.17.24'
  socket.io-parser: '>=4.2.7'
  nanoid: '>=3.3.16'
  postcss: '>=8.5.18'
  # multer arrives through @nestjs/platform-express. 2.x is a major bump but the API used
  # by FileInterceptor is unchanged; the photo upload path is worth a manual check.
  multer: '>=2.1.0'
  sharp: '>=0.35.0'
  # dev tooling: commitlint, the Nest CLI and vitest pull these in transitively
  fast-uri: '>=3.1.4'
  js-yaml: '>=4.3.0'
  glob: '>=10.5.0'
  picomatch: '>=4.0.4'
  tmp: '>=0.2.6'
  vite: '>=6.4.3'
