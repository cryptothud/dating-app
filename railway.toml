[build]
builder = "dockerfile"
dockerfilePath = "apps/api/Dockerfile"
# Only rebuild the API when something it actually compiles from changes. Web-only
# pushes (apps/web, packages/ui) no longer trigger a Railway build. packages/config
# is here because the API's tsconfig extends @dating-app/config/typescript.
watchPatterns = [
  "apps/api/**",
  "packages/db/**",
  "packages/types/**",
  "packages/config/**",
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "turbo.json",
  "railway.toml",
]

[deploy]
# Applies any migration not yet recorded in _prisma_migrations, in order. It never
# resets or drops anything, and is a no-op when nothing is pending. Invoked as the
# binary rather than through pnpm so it does not need a writable HOME for the
# non-root runtime user. A failure here blocks the deploy and leaves the running
# version in place.
preDeployCommand = [
  "packages/db/node_modules/.bin/prisma migrate deploy --schema packages/db/prisma/schema.prisma",
]
startCommand = "node apps/api/dist/main"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
